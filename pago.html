<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Touskan - Pago</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
    <link rel="stylesheet"href="style/pago.css">

</head>


<body>


<nav class="navbar">

    <a
        href="pedidos.html"
        class="volver">

        <i class="bi bi-arrow-left"></i>

        Volver

    </a>


    <div class="logo">
        Touskan
    </div>

</nav>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="container pago-container">


    <h1>
        Checkout
    </h1>


    <div class="row g-4">


        <!-- =================================================
             COLUMNA IZQUIERDA
        ================================================== -->

        <div class="col-lg-8">


            <!-- MÉTODO DE PAGO -->

            <section class="card-pago">

                <h2>
                    Método de Pago
                </h2>


                <!-- BOTONES -->

                <div class="metodos">


                    <!-- TARJETA -->

                    <button
                        type="button"
                        class="metodo activo"
                        id="btnTarjeta"
                        onclick="seleccionarMetodo('tarjeta')">

                        <i class="bi bi-credit-card"></i>

                        <span>
                            Tarjeta
                        </span>

                    </button>


                    <!-- BILLETERA -->

                    <button
                        type="button"
                        class="metodo"
                        id="btnBilletera"
                        onclick="seleccionarMetodo('billetera')">

                        <i class="bi bi-wallet2"></i>

                        <span>
                            Billetera
                        </span>

                    </button>


                    <!-- EFECTIVO -->

                    <button
                        type="button"
                        class="metodo"
                        id="btnEfectivo"
                        onclick="seleccionarMetodo('efectivo')">

                        <i class="bi bi-cash"></i>

                        <span>
                            Efectivo
                        </span>

                    </button>

                </div>

            </section>


            <!-- =================================================
                 TARJETA
            ================================================== -->

            <section
                class="card-pago"
                id="formTarjeta">

                <h2>
                    Detalles de la Tarjeta
                </h2>


                <label for="nombreTarjeta">
                    Nombre en la Tarjeta
                </label>

                <input
                    type="text"
                    id="nombreTarjeta"
                    placeholder="Ej. Juan Pérez"
                >


                <label for="numeroTarjeta">
                    Número de Tarjeta
                </label>

                <input
                    type="text"
                    id="numeroTarjeta"
                    placeholder="0000 0000 0000 0000"
                    maxlength="19"
                    oninput="formatearTarjeta(this)"
                >


                <div class="row">

                    <div class="col-md-6">

                        <label for="vencimiento">
                            Vencimiento (MM/AA)
                        </label>

                        <input
                            type="text"
                            id="vencimiento"
                            placeholder="MM/AA"
                            maxlength="5"
                            oninput="formatearVencimiento(this)"
                        >

                    </div>


                    <div class="col-md-6">

                        <label for="cvv">
                            CVV
                        </label>

                        <input
                            type="password"
                            id="cvv"
                            placeholder="123"
                            maxlength="4"
                        >

                    </div>

                </div>

            </section>


            <!-- =================================================
                 BILLETERA
            ================================================== -->

            <section
                class="card-pago oculto"
                id="formBilletera">

                <h2>
                    Pago con Billetera
                </h2>

                <p>
                    Selecciona tu billetera digital.
                </p>


                <div class="billeteras">


                    <button
                        type="button"
                        id="btnNequi"
                        onclick="seleccionarBilletera('Nequi')">

                        <i class="bi bi-phone"></i>

                        Nequi

                    </button>


                    <button
                        type="button"
                        id="btnDaviplata"
                        onclick="seleccionarBilletera('Daviplata')">

                        <i class="bi bi-phone"></i>

                        Daviplata

                    </button>

                </div>


                <label for="numeroBilletera">
                    Número de celular
                </label>

                <input
                    type="text"
                    id="numeroBilletera"
                    placeholder="Ej. 3001234567"
                    maxlength="10"
                >

            </section>


            <!-- =================================================
                 EFECTIVO
            ================================================== -->

            <section
                class="card-pago oculto"
                id="formEfectivo">

                <h2>
                    Pago en Efectivo
                </h2>


                <div class="efectivo-info">

                    <i class="bi bi-cash-stack"></i>


                    <div>

                        <strong>
                            Pago contra entrega
                        </strong>

                        <p>
                            Paga al recibir tu pedido.
                        </p>

                    </div>

                </div>

            </section>

        </div>


        <!-- =================================================
             COLUMNA DERECHA
        ================================================== -->

        <div class="col-lg-4">


            <section class="resumen">


                <h2>
                    Resumen del Pedido
                </h2>


                <!-- PRODUCTOS -->

                <div id="productosPago"></div>


                <hr>


                <div class="fila">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotalPago">
                        $0
                    </strong>

                </div>


                <div class="fila">

                    <span>
                        Envío
                    </span>

                    <strong id="envioPago">
                        $0
                    </strong>

                </div>


                <div class="fila">

                    <span>
                        Impuestos
                    </span>

                    <strong id="impuestosPago">
                        $0
                    </strong>

                </div>


                <hr>


                <div class="total">

                    <span>
                        Total
                    </span>

                    <strong id="totalPago">
                        $0
                    </strong>

                </div>


                <!-- PAGAR -->

                <button
                    type="button"
                    class="btn-pagar"
                    onclick="procesarPago()">

                    <i class="bi bi-lock-fill"></i>

                    Pagar

                    <span id="textoTotal">
                        $0
                    </span>

                </button>


                <div class="seguro">

                    <i class="bi bi-shield-check"></i>

                    Pago seguro y protegido

                </div>

            </section>

        </div>

    </div>

</main>


<!-- JAVASCRIPT -->

<script src="js/java.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
