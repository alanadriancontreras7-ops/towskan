<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <link rel="stylesheet" href="style/sesion.css">
</head>

<body>
<a href="index.html" class="btn-volver">
        <i class="bi bi-arrow-left"></i>
        Volver
    </a>



    <div class="container">

        <!-- PRESENTACIÓN -->
        <div class="left">

            <div class="logo">
                Touskan
            </div>

            <h1>
                Bienvenido de nuevo
            </h1>

            <p>
                Inicia sesión para acceder a tu cuenta
                y continuar utilizando nuestra plataforma.
            </p>

        </div>


        <!-- FORMULARIO -->
        <div class="right">

            <h2>Iniciar sesión</h2>

            <p class="subtitle">
                Ingresa tus datos para continuar
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#" class="forgot">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit" class="btn">
                    Iniciar sesión
                </button>

            </form>


            <div class="divider">
                O continúa con
            </div>


            <button class="google">
                🔵 Continuar con Google
            </button>


            <div class="register">
                ¿No tienes una cuenta?
                <a href="registro.html">
                    Crear cuenta
                </a>
            </div>

        </div>

    </div>


    <script>

        // DEMO: la cuenta se guarda solo en este navegador.
        // Para producción se necesita un servidor con contraseñas cifradas.
        async function hashPassword(texto) {

            if (!window.crypto || !crypto.subtle) {
                throw new Error("Este navegador no permite cifrar la contraseña.");
            }

            const datos = new TextEncoder().encode(texto);
            const hash = await crypto.subtle.digest("SHA-256", datos);

            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");

        }

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const email = document.getElementById("email").value.trim().toLowerCase();
                const password = document.getElementById("password").value;

                if (email === "" || password === "") {
                    alert("Completa todos los campos.");
                    return;
                }

                let usuario = null;

                try {
                    usuario = JSON.parse(localStorage.getItem("usuarioTouskan"));
                } catch (error) {
                    usuario = null;
                }

                if (!usuario) {
                    alert("No hay ninguna cuenta creada en este navegador. Regístrate primero.");
                    return;
                }

                try {

                    const hash = await hashPassword(password);

                    if (usuario.email !== email || usuario.hash !== hash) {
                        alert("Correo o contraseña incorrectos.");
                        return;
                    }

                    localStorage.setItem(
                        "sesionTouskan",
                        JSON.stringify({ nombre: usuario.nombre, email: usuario.email })
                    );

                    window.location.href = "menu.html";

                } catch (error) {

                    alert(error.message);

                }

            });

        document
            .querySelector(".google")
            .addEventListener("click", function () {
                alert("El inicio de sesión con Google estará disponible pronto.");
            });

    </script>

</body>
</html>
